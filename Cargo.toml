[package]
name = "kinara"
version = "0.2.0"
edition = "2021"
authors = ["HrithvikM"]
description = "High-performance GPU-accelerated motion capture engine with finger-accurate 3D hand tracking."
license = "MIT"
readme = "README.md"
keywords = ["motion-capture", "pose-estimation", "biomechanics", "mocap", "rust"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
glam = { version = "0.30", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
eframe = "0.37.0"
rfd = "0.18.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
